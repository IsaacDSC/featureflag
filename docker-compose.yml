version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: featureflag-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=featureflag
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - featureflag-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: featureflag-app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/featureflag?authSource=admin
      - MONGODB_NAME=featureflag
      - REPOSITORY_TYPE=mongodb
      - MONGODB_IDX_TIMEOUT=2s
      - SECRET_KEY=secret
      - SERVICE_CLIENT_AT=service
      - SDK_CLIENT_AT=sdk
      # admin@example.com / senha: admin (apenas para desenvolvimento local).
      # "$$" escapa o "$" da interpolação do próprio docker-compose (spec 003 §4.2).
      - ADMIN_USERS=admin@example.com:$$2a$$10$$6/oR1gXPk4QWpxNUcyTfz.fguFrPR.vplqcNERFZz0N2p1/iFFrZO
      - PORT=3000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/ping",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - featureflag-network

  mongo-express:
    image: mongo-express:latest
    container_name: featureflag-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - featureflag-network

networks:
  featureflag-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
